<style>
/* ===== Boba Crochet — design tokens ===== */
:root {
  --cream: #FBF3E7;
  --cream-deep: #F3E7D6;
  --terracotta: #B5674A;
  --terracotta-deep: #8F4E37;
  --cocoa: #4A3728;
  --cocoa-soft: #7A6353;
  --sage: #7C9473;
  --dusty-rose: #C97F88;
  --gold: #C79A3E;
  --card-bg: #FFFFFF;
  --border-soft: rgba(74, 55, 40, 0.12);
  --shadow-soft: 0 6px 20px rgba(74, 55, 40, 0.08);
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 9px;
  --font-display: 'Fredoka', 'Baloo 2', system-ui, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --cream: #1E1814;
    --cream-deep: #241C17;
    --card-bg: #2A211B;
    --cocoa: #F3E7D6;
    --cocoa-soft: #C7B6A6;
    --border-soft: rgba(243, 231, 214, 0.1);
    --shadow-soft: 0 6px 20px rgba(0, 0, 0, 0.35);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--cream);
  color: var(--cocoa);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}

body {
  padding-bottom: calc(64px + env(safe-area-inset-bottom));
  overscroll-behavior-y: contain;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  margin: 0 0 8px;
  letter-spacing: 0.2px;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

/* ===== App shell ===== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--cream);
  border-bottom: 1px solid var(--border-soft);
  padding: calc(env(safe-area-inset-top) + 14px) 18px 12px;
}

.app-header .brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-size: 1.4rem;
  color: var(--terracotta-deep);
}

.app-header .brand .yarn-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--terracotta);
  box-shadow: 0 0 0 3px var(--gold) inset;
}

.page-title {
  font-size: 1.3rem;
  margin: 4px 0 0;
}

.back-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.back-btn {
  background: none;
  border: none;
  font-size: 1.4rem;
  color: var(--terracotta);
  cursor: pointer;
  padding: 4px 8px 4px 0;
}

main {
  padding: 16px 16px 40px;
  max-width: 720px;
  margin: 0 auto;
}

/* ===== Bottom nav ===== */
.bottom-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  display: flex;
  background: var(--card-bg);
  border-top: 1px solid var(--border-soft);
  padding-bottom: env(safe-area-inset-bottom);
}

.bottom-nav button {
  flex: 1;
  background: none;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 0 6px;
  font-size: 0.68rem;
  color: var(--cocoa-soft);
  cursor: pointer;
}

.bottom-nav button .icon { font-size: 1.25rem; }
.bottom-nav button.active { color: var(--terracotta); }

/* ===== Cards ===== */
.card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  border: 1px solid var(--border-soft);
}

.pattern-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.pattern-card {
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.pattern-card:active { transform: scale(0.97); }

.pattern-card .cover {
  height: 96px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.1rem;
  margin: 8px;
  border-radius: var(--radius-md);
}

.pattern-card .body { padding: 0 10px 10px; }
.pattern-card .title { font-size: 0.86rem; font-weight: 600; line-height: 1.25; margin-bottom: 6px; min-height: 2.2em; }
.pattern-card .meta { display: flex; align-items: center; justify-content: space-between; font-size: 0.68rem; color: var(--cocoa-soft); }

.hscroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.hscroll::-webkit-scrollbar { display: none; }
.hscroll .pattern-card { min-width: 148px; flex: 0 0 auto; }

/* ===== Badges & chips ===== */
.badge {
  display: inline-block;
  font-size: 0.66rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 999px;
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
}
.badge.beginner { background: rgba(124,148,115,0.18); color: var(--sage); }
.badge.easy { background: rgba(124,148,115,0.15); color: #5f7a55; }
.badge.intermediate { background: rgba(199,154,62,0.2); color: var(--gold); }
.badge.advanced { background: rgba(197,90,74,0.18); color: #c25a4a; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.75rem;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(181,103,74,0.1);
  color: var(--terracotta-deep);
  border: none;
  cursor: pointer;
  white-space: nowrap;
}
.chip.active { background: var(--terracotta); color: #fff; }

.tag {
  font-size: 0.72rem;
  padding: 5px 10px;
  border-radius: 999px;
  background: rgba(199,154,62,0.16);
  color: var(--terracotta-deep);
  display: inline-block;
  margin: 0 6px 6px 0;
}

/* ===== Section headers ===== */
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 22px 0 12px;
}
.section-title h2 { font-size: 1.05rem; }
.section-title .see-all { font-size: 0.8rem; color: var(--terracotta); }

/* ===== Search / filters ===== */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card-bg);
  border: 1px solid var(--border-soft);
  border-radius: 999px;
  padding: 10px 16px;
  margin-bottom: 12px;
}
.search-bar input {
  border: none;
  outline: none;
  background: transparent;
  font-size: 0.9rem;
  width: 100%;
  color: var(--cocoa);
  font-family: var(--font-body);
}
.filter-row { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }

/* ===== Signature element: stitch-row progress ===== */
.stitch-row {
  display: flex;
  gap: 3px;
  align-items: center;
  flex-wrap: wrap;
}
.stitch {
  width: 10px; height: 10px;
  position: relative;
  flex: 0 0 auto;
}
.stitch::before {
  content: '';
  position: absolute; inset: 0;
  clip-path: polygon(50% 0%, 100% 100%, 75% 100%, 50% 45%, 25% 100%, 0% 100%);
  background: var(--border-soft);
}
.stitch.done::before { background: var(--terracotta); }
.stitch.current::before { background: var(--gold); }

.progress-track {
  height: 8px;
  border-radius: 999px;
  background: var(--border-soft);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--terracotta), var(--gold));
  transition: width 0.3s ease;
}

/* ===== Pattern detail ===== */
.detail-cover {
  height: 150px;
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3.4rem;
  margin-bottom: 14px;
}
.detail-summary { color: var(--cocoa-soft); font-size: 0.92rem; margin-bottom: 10px; }
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 16px 0;
}
.info-tile {
  padding: 10px 12px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.info-tile .ico { font-size: 1.1rem; color: var(--terracotta); }
.info-tile .label { font-size: 0.65rem; color: var(--cocoa-soft); text-transform: uppercase; letter-spacing: 0.04em; }
.info-tile .value { font-size: 0.82rem; font-weight: 600; }

.section-card { padding: 16px; margin-bottom: 14px; }
.section-card h3 { font-size: 0.95rem; margin-bottom: 10px; }
.material-row { display: flex; justify-content: space-between; font-size: 0.86rem; padding: 5px 0; border-bottom: 1px dashed var(--border-soft); }
.material-row:last-child { border-bottom: none; }
.material-row .amt { color: var(--cocoa-soft); font-family: var(--font-mono); font-size: 0.78rem; }

.note-line { font-size: 0.85rem; color: var(--cocoa-soft); margin: 6px 0; padding-left: 18px; position: relative; }
.note-line::before { content: '✦'; position: absolute; left: 0; color: var(--gold); font-size: 0.7rem; top: 3px; }

.btn-primary {
  display: block;
  width: 100%;
  text-align: center;
  background: var(--terracotta);
  color: #fff;
  border: none;
  border-radius: var(--radius-md);
  padding: 15px;
  font-size: 1rem;
  font-weight: 600;
  font-family: var(--font-display);
  cursor: pointer;
  margin-top: 6px;
}
.btn-primary:active { background: var(--terracotta-deep); }

.btn-secondary {
  background: rgba(181,103,74,0.1);
  color: var(--terracotta-deep);
  border: none;
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  font-size: 0.8rem;
  cursor: pointer;
}

.icon-btn {
  background: none;
  border: none;
  font-size: 1.3rem;
  cursor: pointer;
  color: var(--cocoa);
}
.icon-btn.active { color: var(--dusty-rose); }

/* ===== Tracker ===== */
.tracker-header {
  position: sticky;
  top: 0;
  z-index: 15;
  background: var(--cream);
  border-bottom: 1px solid var(--border-soft);
  padding: 12px 16px;
}
.tracker-header .row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.timer-btn {
  font-family: var(--font-mono);
  font-weight: 600;
  background: rgba(199,154,62,0.18);
  border: none;
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 0.8rem;
  cursor: pointer;
  color: var(--terracotta-deep);
}

.row-card {
  padding: 12px 14px;
  margin-bottom: 10px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  cursor: pointer;
}
.row-card.current { border: 2px solid var(--terracotta); background: rgba(199,154,62,0.08); }
.row-check {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 2px solid var(--cocoa-soft);
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  background: none;
  font-size: 0.9rem;
  color: transparent;
  margin-top: 2px;
}
.row-check.done { border-color: var(--terracotta); background: var(--terracotta); color: #fff; }
.row-section { font-family: var(--font-mono); font-size: 0.7rem; color: var(--terracotta); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }
.row-instruction { font-size: 0.88rem; line-height: 1.4; }
.row-instruction.done { text-decoration: line-through; color: var(--cocoa-soft); }
.row-note { font-size: 0.75rem; color: var(--cocoa-soft); margin-top: 4px; font-style: italic; }
.row-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.mini-btn {
  font-size: 0.68rem;
  background: rgba(124,148,115,0.15);
  color: var(--sage);
  border: none;
  border-radius: 999px;
  padding: 4px 9px;
  cursor: pointer;
}

.tracker-controls {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--card-bg);
  border-top: 1px solid var(--border-soft);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  display: flex;
  gap: 10px;
  z-index: 25;
}
.counter-box {
  flex: 0 0 96px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: rgba(199,154,62,0.15);
  border-radius: var(--radius-sm);
  border: none;
  padding: 8px 0;
  cursor: pointer;
}
.counter-box .num { font-family: var(--font-mono); font-size: 1.2rem; font-weight: 700; color: var(--terracotta-deep); }
.counter-box .lbl { font-size: 0.6rem; color: var(--cocoa-soft); }

/* ===== Forms ===== */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 0.75rem; color: var(--cocoa-soft); margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  background: var(--card-bg);
  color: var(--cocoa);
  font-size: 0.9rem;
  font-family: var(--font-body);
}
.field textarea { min-height: 80px; resize: vertical; }

.list-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
}
.list-row:last-child { border-bottom: none; }
.list-row .name { font-weight: 600; font-size: 0.9rem; }
.list-row .sub { font-size: 0.75rem; color: var(--cocoa-soft); }

.fab {
  position: fixed;
  right: 18px;
  bottom: calc(78px + env(safe-area-inset-bottom));
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--terracotta);
  color: #fff;
  font-size: 1.6rem;
  border: none;
  box-shadow: 0 8px 20px rgba(181,103,74,0.4);
  cursor: pointer;
  z-index: 22;
  display: flex; align-items: center; justify-content: center;
}

.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--cocoa-soft);
}
.empty-state .glyph { font-size: 2.4rem; margin-bottom: 10px; display: block; }

.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 50;
  display: flex;
  align-items: flex-end;
}
.modal-sheet {
  background: var(--cream);
  width: 100%;
  border-radius: 20px 20px 0 0;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height: 85vh;
  overflow-y: auto;
}
.modal-sheet .modal-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.modal-sheet .modal-title button { background: none; border: none; font-size: 0.9rem; color: var(--terracotta); cursor: pointer; }

.toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
.switch { position: relative; width: 44px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .track {
  position: absolute; inset: 0;
  background: var(--border-soft);
  border-radius: 999px;
  transition: 0.2s;
  cursor: pointer;
}
.switch .track::before {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  left: 3px; top: 3px;
  background: #fff;
  border-radius: 50%;
  transition: 0.2s;
}
.switch input:checked + .track { background: var(--terracotta); }
.switch input:checked + .track::before { transform: translateX(18px); }

.tip-block, .mistake-block { padding: 14px; margin-bottom: 12px; }
.tip-block h4, .mistake-block h4 { font-size: 0.85rem; margin-bottom: 8px; }
.tip-block h4 { color: var(--sage); }
.mistake-block h4 { color: #c98a3e; }
.tip-block li, .mistake-block li { font-size: 0.83rem; margin-bottom: 6px; }

.step-card {
  padding: 12px;
  margin-bottom: 10px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.step-num {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: rgba(199,154,62,0.2);
  color: var(--terracotta-deep);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 700;
  flex: 0 0 auto;
}
.step-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 2px; }
.step-instruction { font-size: 0.83rem; color: var(--cocoa-soft); }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: var(--cocoa);
  color: var(--cream);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 0.82rem;
  z-index: 60;
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

@media (min-width: 600px) {
  .pattern-grid { grid-template-columns: repeat(3, 1fr); }
}

function getPattern(id) {
  return PATTERNS.find(p => p.id === id);
}

function patternsInCategory(catId) {
  return PATTERNS.filter(p => p.category === catId);
}

function categoriesWithContent() {
  return CATEGORIES.filter(c => patternsInCategory(c.id).length > 0);
}

// ===== indexeddb wrapper =====
// Lightweight promise-based IndexedDB wrapper for Boba Crochet.
// Stores: projects, yarn, hooks, favorites, recents, progress

const DB_NAME = 'boba-crochet';
const DB_VERSION = 1;
const STORES = ['projects', 'yarn', 'hooks', 'favorites', 'recents', 'progress'];

let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('yarn')) db.createObjectStore('yarn', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('hooks')) db.createObjectStore('hooks', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('favorites')) db.createObjectStore('favorites', { keyPath: 'patternId' });
      if (!db.objectStoreNames.contains('recents')) db.createObjectStore('recents', { keyPath: 'patternId' });
      if (!db.objectStoreNames.contains('progress')) db.createObjectStore('progress', { keyPath: 'patternId' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function tx(storeName, mode) {
  return openDB().then(db => db.transaction(storeName, mode).objectStore(storeName));
}

const db = {
  async getAll(store) {
    const s = await tx(store, 'readonly');
    return new Promise((resolve, reject) => {
      const req = s.getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async get(store, key) {
    const s = await tx(store, 'readonly');
    return new Promise((resolve, reject) => {
      const req = s.get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  },
  async put(store, value) {
    const s = await tx(store, 'readwrite');
    return new Promise((resolve, reject) => {
      const req = s.put(value);
      req.onsuccess = () => resolve(value);
      req.onerror = () => reject(req.error);
    });
  },
  async delete(store, key) {
    const s = await tx(store, 'readwrite');
    return new Promise((resolve, reject) => {
      const req = s.delete(key);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }
};

function uid() {
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);

const mainEl = document.getElementById('main-content');

// ===================== Utilities =====================

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function toast(msg) {
  toastRoot.textContent = msg;
  toastRoot.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastRoot.classList.remove('show'), 1800);
}

function closeModal() { modalRoot.innerHTML = ''; }

function openModal(innerHtml, onMount) {
  modalRoot.innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><div class="modal-sheet">${innerHtml}</div></div>`;
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target.id === 'modal-backdrop') closeModal();
  });
  if (onMount) onMount(modalRoot);
}

function badgeClass(diff) {
  return { Beginner: 'beginner', Easy: 'easy', Intermediate: 'intermediate', Advanced: 'advanced' }[diff] || 'easy';
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

const routes = {
  library: () => renderLibrary(),
  'library/category': (id) => renderCategory(id),
  pattern: (id) => renderPatternDetail(id),
  track: (id) => renderTracker(id),
  learn: () => renderLearn(),
  tutorial: (id) => renderTutorialDetail(id),
  projects: () => renderProjects(),
  'project-new': () => renderProjectForm(null),
  project: (id) => renderProjectForm(id),
  stash: (tab) => renderStash(tab || 'yarn'),
  'yarn-new': () => renderYarnForm(null),
  yarn: (id) => renderYarnForm(id),
  'hook-new': () => renderHookForm(null),
  hookitem: (id) => renderHookForm(id),
  favorites: () => renderFavorites()
};

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  return parts.length ? parts : ['library'];
}

function navigate(path) {
  location.hash = '#/' + path;
}

async function render() {
  stopTrackerTimerIfRunning();
  const parts = parseHash();
  let key = parts[0];
  let arg = parts[1];

  if (key === 'library' && parts[1] === 'category') { key = 'library/category'; arg = parts[2]; }
  if (key === 'stash') { arg = parts[1]; }

  updateNavHighlight(key);
  updateHeader(key, arg);

  const handler = routes[key] || routes.library;
  mainEl.innerHTML = '<div class="empty-state">Loading…</div>';
  try {
    await handler(arg);
  } catch (err) {
    console.error(err);
    mainEl.innerHTML = `<div class="empty-state"><span class="glyph">⚠</span>Something went wrong loading this screen.</div>`;
  }
  window.scrollTo(0, 0);
}

function updateNavHighlight(key) {
  const topTab = key.startsWith('library') || key === 'pattern' || key === 'track' ? 'library'
    : key === 'learn' || key === 'tutorial' ? 'learn'
    : key.startsWith('project') ? 'projects'
    : key === 'stash' || key === 'yarn' || key === 'yarn-new' || key === 'hookitem' || key === 'hook-new' ? 'stash'
    : key === 'favorites' ? 'favorites' : 'library';
  [...navEl.children].forEach(btn => btn.classList.toggle('active', btn.dataset.route === topTab));
  const hideNav = ['pattern', 'track', 'tutorial', 'project', 'project-new', 'yarn', 'yarn-new', 'hookitem', 'hook-new'].includes(key);
  navEl.style.display = hideNav ? 'none' : 'flex';
  document.body.style.paddingBottom = hideNav ? '0' : '';
}

function updateHeader(key, arg) {
  const titles = { library: 'Boba Crochet', learn: 'Learn to Crochet', projects: 'My Projects', stash: 'My Stash', favorites: 'Favorites' };
  if (titles[key]) {
    headerEl.innerHTML = `<div class="brand"><span class="yarn-dot"></span> ${titles[key]}</div>`;
    return;
  }
  const backMap = {
    'library/category': 'library', pattern: 'library', track: -1,
    tutorial: 'learn', project: 'projects', 'project-new': 'projects',
    yarn: 'stash/yarn', 'yarn-new': 'stash/yarn', hookitem: 'stash/hooks', 'hook-new': 'stash/hooks'
  };
  let label = 'Back';
  if (key === 'pattern') label = getPattern(arg)?.title || 'Pattern';
  else if (key === 'track') label = getPattern(arg)?.title || 'Pattern';
  else if (key === 'tutorial') label = getTutorial(arg)?.title || 'Tutorial';
  else if (key === 'library/category') label = CATEGORIES.find(c => c.id === arg)?.label || 'Category';
  else if (key === 'project' || key === 'project-new') label = 'Project';
  else if (key === 'yarn' || key === 'yarn-new') label = 'Yarn';
  else if (key === 'hookitem' || key === 'hook-new') label = 'Hook';

  headerEl.innerHTML = `<div class="back-row"><button class="back-btn" id="back-btn">‹</button><h1 class="page-title">${esc(label)}</h1></div>`;
  document.getElementById('back-btn').addEventListener('click', () => {
    const target = backMap[key];
    if (target === -1) history.back();
    else navigate(target || 'library');
  });
}

window.addEventListener('hashchange', render);

let libraryState = { search: '', difficulty: '', season: '' };

async function renderLibrary() {
  const recents = await db.getAll('recents');
  recents.sort((a, b) => b.viewedAt - a.viewedAt);
  const recentPatterns = recents.slice(0, 8).map(r => getPattern(r.patternId)).filter(Boolean);

  const seasons = ['Spring', 'Summer', 'Fall', 'Winter', 'Any Season'];
  const isFiltering = !!(libraryState.search || libraryState.difficulty || libraryState.season);

  mainEl.innerHTML = `
    <div class="search-bar">
      <span>🔍</span>
      <input id="search-input" placeholder="Search patterns, tags, yarn..." value="${esc(libraryState.search)}" />
    </div>
    <div class="filter-row">
      <button class="chip ${libraryState.difficulty ? 'active' : ''}" id="diff-chip">${libraryState.difficulty || 'Difficulty'} ▾</button>
      <button class="chip ${libraryState.season ? 'active' : ''}" id="season-chip">${libraryState.season || 'Season'} ▾</button>
      ${isFiltering ? `<button class="chip" id="clear-chip">Clear ✕</button>` : ''}
    </div>
    <div id="library-body"></div>
  `;

  document.getElementById('search-input').addEventListener('input', e => {
    libraryState.search = e.target.value;
    renderLibraryBody();
  });
  document.getElementById('diff-chip').addEventListener('click', () => cyclePick('difficulty', ['', ...DIFFICULTIES]));
  document.getElementById('season-chip').addEventListener('click', () => cyclePick('season', ['', ...seasons]));
  const clearChip = document.getElementById('clear-chip');
  if (clearChip) clearChip.addEventListener('click', () => { libraryState = { search: '', difficulty: '', season: '' }; renderLibrary(); });

  function cyclePick(field, options) {
    openModal(`
      <div class="modal-title"><h3>${field === 'difficulty' ? 'Difficulty' : 'Season'}</h3><button id="modal-close">Done</button></div>
      ${options.map(o => `<div class="list-row" data-val="${esc(o)}"><span class="name">${o || 'Any'}</span>${libraryState[field] === o ? '<span>✓</span>' : ''}</div>`).join('')}
    `, root => {
      root.querySelectorAll('.list-row').forEach(r => r.addEventListener('click', () => {
        libraryState[field] = r.dataset.val;
        closeModal();
        renderLibrary();
      }));
      document.getElementById('modal-close').addEventListener('click', closeModal);
    });
  }

  function renderLibraryBody() {
    const body = document.getElementById('library-body');
    if (!body) return;
    const filtering = !!(libraryState.search || libraryState.difficulty || libraryState.season);
    let list = PATTERNS;
    if (libraryState.search) {
      const q = libraryState.search.toLowerCase();
      list = list.filter(p => p.title.toLowerCase().includes(q) || p.summary.toLowerCase().includes(q) ||
        p.tags.some(t => t.toLowerCase().includes(q)) || p.category.toLowerCase().includes(q));
    }
    if (libraryState.difficulty) list = list.filter(p => p.difficulty === libraryState.difficulty);
    if (libraryState.season) list = list.filter(p => p.season === libraryState.season || p.season === 'Any Season');

    if (filtering) {
      body.innerHTML = list.length ? `
        <div class="section-title"><h2>${list.length} pattern${list.length === 1 ? '' : 's'}</h2></div>
        <div class="pattern-grid">${list.map(patternCardHtml).join('')}</div>
      ` : `<div class="empty-state"><span class="glyph">🔍</span>No patterns found. Try a different search or clear your filters.</div>`;
      wirePatternCards(body);
      return;
    }

    let html = '';
    if (recentPatterns.length) {
      html += `<div class="section-title"><h2>Continue Browsing</h2></div><div class="hscroll">${recentPatterns.map(patternCardHtml).join('')}</div>`;
    }
    for (const cat of categoriesWithContent()) {
      const items = patternsInCategory(cat.id);
      html += `
        <div class="section-title"><h2>${cat.icon} ${cat.label}</h2><span class="see-all" data-cat="${cat.id}">See all ›</span></div>
        <div class="hscroll">${items.map(patternCardHtml).join('')}</div>
      `;
    }
    body.innerHTML = html;
    wirePatternCards(body);
    body.querySelectorAll('.see-all').forEach(el => el.addEventListener('click', () => navigate(`library/category/${el.dataset.cat}`)));
  }

  renderLibraryBody();
}

function patternCardHtml(p) {
  return `
    <div class="card pattern-card" data-id="${p.id}">
      <div class="cover" style="background:${colorFor(p.category)}22">${iconFor(p.category)}</div>
      <div class="body">
        <div class="title">${esc(p.title)}</div>
        <div class="meta"><span class="badge ${badgeClass(p.difficulty)}">${p.difficulty}</span><span>${p.timeDisplay}</span></div>
      </div>
    </div>
  `;
}

function wirePatternCards(container) {

// ===================== Interactive Tracker =====================

let trackerTimerHandle = null;
let trackerState = null;

function stopTrackerTimerIfRunning() {
  if (trackerTimerHandle) { clearInterval(trackerTimerHandle); trackerTimerHandle = null; }
}

async function renderTracker(id) {
  const p = getPattern(id);
  if (!p) { mainEl.innerHTML = `<div class="empty-state">Pattern not found.</div>`; return; }

  const saved = await db.get('progress', id);
  trackerState = saved ? {
    completedRowIds: new Set(saved.completedRowIds),
    currentRowId: saved.currentRowId,
    repeatCounters: saved.repeatCounters || {},
    stitchCounter: saved.stitchCounter || 0,
    rowNotes: saved.rowNotes || {},
    undoStack: saved.undoStack || [],
    redoStack: saved.redoStack || [],
    timerSeconds: saved.timerSeconds || 0,
    running: false
  } : {
    completedRowIds: new Set(), currentRowId: p.rows[0]?.id, repeatCounters: {}, stitchCounter: 0,
    rowNotes: {}, undoStack: [], redoStack: [], timerSeconds: 0, running: false
  };

  navEl.style.display = 'none';
  document.body.style.paddingBottom = '0';

  function timeStr(s) { const m = Math.floor(s / 60), sec = s % 60; return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`; }

  function persist() {
    db.put('progress', {
      patternId: id,
      completedRowIds: [...trackerState.completedRowIds],
      currentRowId: trackerState.currentRowId,
      repeatCounters: trackerState.repeatCounters,
      stitchCounter: trackerState.stitchCounter,
      rowNotes: trackerState.rowNotes,
      undoStack: trackerState.undoStack,
      redoStack: trackerState.redoStack,
      timerSeconds: trackerState.timerSeconds,
      lastUpdated: Date.now()
    });
  }

  function currentRow() { return p.rows.find(r => r.id === trackerState.currentRowId); }

  function advanceAfter(rowId) {
    const idx = p.rows.findIndex(r => r.id === rowId);
    if (idx !== -1 && idx + 1 < p.rows.length) trackerState.currentRowId = p.rows[idx + 1].id;
  }

  function toggleRow(rowId) {
    if (trackerState.completedRowIds.has(rowId)) {
      trackerState.completedRowIds.delete(rowId);
    } else {
      trackerState.completedRowIds.add(rowId);
      trackerState.undoStack.push(rowId);
      trackerState.redoStack = [];
      advanceAfter(rowId);
    }
    persist();
    paintAll();
  }

  function incrementRepeat(row) {
    const cur = trackerState.repeatCounters[row.id] || 0;
    if (cur < row.repeatCount) {
      trackerState.repeatCounters[row.id] = cur + 1;
      if (trackerState.repeatCounters[row.id] === row.repeatCount) {
        trackerState.completedRowIds.add(row.id);
        advanceAfter(row.id);
      }
    }
    persist();
    paintAll();
  }

  function undo() {
    const last = trackerState.undoStack.pop();
    if (last === undefined) return;
    trackerState.completedRowIds.delete(last);
    trackerState.redoStack.push(last);
    trackerState.currentRowId = last;
    persist();
    paintAll();
  }

  function redo() {
    const id2 = trackerState.redoStack.pop();
    if (id2 === undefined) return;
    trackerState.completedRowIds.add(id2);
    trackerState.undoStack.push(id2);
    advanceAfter(id2);
    persist();
    paintAll();
  }

  function resetProgress() {
    trackerState.completedRowIds.clear();
    trackerState.repeatCounters = {};
    trackerState.stitchCounter = 0;
    trackerState.rowNotes = {};
    trackerState.undoStack = [];
    trackerState.redoStack = [];
    trackerState.currentRowId = p.rows[0]?.id;
    trackerState.timerSeconds = 0;
    persist();
    paintAll();
  }

  function rowCardHtml(row) {
    const done = trackerState.completedRowIds.has(row.id);
    const isCurrent = row.id === trackerState.currentRowId;
    const note = trackerState.rowNotes[row.id];
    const repProg = trackerState.repeatCounters[row.id] || 0;
    return `
      <div class="card row-card ${isCurrent ? 'current' : ''}" data-row="${row.id}">
        <button class="row-check ${done ? 'done' : ''}" data-toggle="${row.id}">${done ? '✓' : ''}</button>
        <div style="flex:1">
          <div class="row-section">${esc(row.section)}</div>
          <div class="row-instruction ${done ? 'done' : ''}">${esc(row.instruction)}</div>
          ${note ? `<div class="row-note">📝 ${esc(note)}</div>` : ''}
          ${row.stitchCount ? `<div class="row-note">Stitch count: ${row.stitchCount}</div>` : ''}
          ${row.note ? `<div class="row-note">${esc(row.note)}</div>` : ''}
          <div class="row-actions">
            ${row.repeatCount > 1 ? `<button class="mini-btn" data-repeat="${row.id}">↻ ${repProg}/${row.repeatCount}</button>` : ''}
            <button class="mini-btn" data-note="${row.id}">${note ? '✎ Edit Note' : '✎ Add Note'}</button>
          </div>
        </div>
      </div>
    `;
  }

  function paintAll() {
    document.getElementById('tk-progress-fill').style.width = `${Math.round((trackerState.completedRowIds.size / p.rows.length) * 100)}%`;
    document.getElementById('tk-progress-label').textContent = `${trackerState.completedRowIds.size} of ${p.rows.length} rows`;
    document.getElementById('tk-current-section').textContent = currentRow()?.section || 'All done! 🎉';
    document.getElementById('tk-stitch-count').textContent = trackerState.stitchCounter;
    const list = document.getElementById('tk-row-list');
    list.innerHTML = p.rows.map(rowCardHtml).join('');
    wireRowList();
    const currentEl = list.querySelector('.row-card.current');
    if (currentEl) currentEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
    document.getElementById('tk-mark-btn').textContent = currentRow()
      ? (trackerState.completedRowIds.has(currentRow().id) ? 'Mark Undone' : 'Mark Row Done')
      : 'All Done';
  }

  function wireRowList() {
    document.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); toggleRow(Number(b.dataset.toggle)); }));
    document.querySelectorAll('[data-repeat]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      incrementRepeat(p.rows.find(r => r.id === Number(b.dataset.repeat)));
    }));
    document.querySelectorAll('[data-note]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      openNoteEditor(Number(b.dataset.note));
    }));
    document.querySelectorAll('.row-card').forEach(el => el.addEventListener('click', () => {
      trackerState.currentRowId = Number(el.dataset.row);
      persist();
      paintAll();
    }));
  }

  function openNoteEditor(rowId) {
    const existing = trackerState.rowNotes[rowId] || '';
    openModal(`
      <div class="modal-title"><h3>Row Note</h3><button id="note-save">Save</button></div>
      <div class="field"><textarea id="note-text" placeholder="Add a note for this row...">${esc(existing)}</textarea></div>
    `, () => {
      document.getElementById('note-save').addEventListener('click', () => {
        const val = document.getElementById('note-text').value;
        trackerState.rowNotes[rowId] = val;
        persist();
        closeModal();
        paintAll();
      });
    });
  }

  mainEl.innerHTML = `
    <div class="tracker-header">
      <div class="row1">
        <div>
          <div id="tk-current-section" style="font-weight:600;font-family:var(--font-display);"></div>
          <div id="tk-progress-label" style="font-size:0.75rem;color:var(--cocoa-soft);"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="timer-btn" id="tk-timer-btn">▶ ${timeStr(trackerState.timerSeconds)}</button>
          <button class="icon-btn" id="tk-menu-btn">⋯</button>
          <button class="icon-btn" id="tk-close-btn">✕</button>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="tk-progress-fill" style="width:0%"></div></div>
    </div>
    <div id="tk-row-list" style="padding:14px 0 90px;"></div>
    <div class="tracker-controls">
      <button class="counter-box" id="tk-stitch-box"><span class="num" id="tk-stitch-count">0</span><span class="lbl">STITCH COUNT</span></button>
      <button class="btn-primary" id="tk-mark-btn" style="flex:1;margin-top:0;"></button>
    </div>
  `;

  document.getElementById('tk-close-btn').addEventListener('click', () => { persist(); navigate(`pattern/${id}`); });
  document.getElementById('tk-timer-btn').addEventListener('click', () => {
    trackerState.running = !trackerState.running;
    const btn = document.getElementById('tk-timer-btn');
    if (trackerState.running) {
      btn.textContent = `⏸ ${timeStr(trackerState.timerSeconds)}`;
      trackerTimerHandle = setInterval(() => {
        trackerState.timerSeconds++;
        btn.textContent = `⏸ ${timeStr(trackerState.timerSeconds)}`;
      }, 1000);
    } else {
      stopTrackerTimerIfRunning();
      btn.textContent = `▶ ${timeStr(trackerState.timerSeconds)}`;
      persist();
    }
  });
  document.getElementById('tk-mark-btn').addEventListener('click', () => {
    const row = currentRow();
    if (row) toggleRow(row.id);
  });
  document.getElementById('tk-stitch-box').addEventListener('click', () => {
    openModal(`
      <div class="modal-title"><h3>Stitch Counter</h3><button id="sc-close">Done</button></div>
      <div style="text-align:center;">
        <div style="font-family:var(--font-mono);font-size:3rem;font-weight:700;color:var(--terracotta-deep);" id="sc-num">${trackerState.stitchCounter}</div>
        <div style="display:flex;justify-content:center;gap:20px;margin-top:14px;">
          <button class="icon-btn" id="sc-minus" style="font-size:2rem;">−</button>
          <button class="btn-secondary" id="sc-reset">Reset</button>
          <button class="icon-btn" id="sc-plus" style="font-size:2rem;">+</button>
        </div>
      </div>
    `, () => {
      const numEl = document.getElementById('sc-num');
      document.getElementById('sc-minus').addEventListener('click', () => { trackerState.stitchCounter = Math.max(0, trackerState.stitchCounter - 1); numEl.textContent = trackerState.stitchCounter; document.getElementById('tk-stitch-count').textContent = trackerState.stitchCounter; persist(); });
      document.getElementById('sc-plus').addEventListener('click', () => { trackerState.stitchCounter++; numEl.textContent = trackerState.stitchCounter; document.getElementById('tk-stitch-count').textContent = trackerState.stitchCounter; persist(); });
      document.getElementById('sc-reset').addEventListener('click', () => { trackerState.stitchCounter = 0; numEl.textContent = 0; document.getElementById('tk-stitch-count').textContent = 0; persist(); });
      document.getElementById('sc-close').addEventListener('click', closeModal);
    });
  });
  document.getElementById('tk-menu-btn').addEventListener('click', () => {
    openModal(`
      <div class="modal-title"><h3>Options</h3><button id="opt-close">Close</button></div>
      <div class="list-row" id="opt-undo"><span class="name">↶ Undo</span></div>
      <div class="list-row" id="opt-redo"><span class="name">↷ Redo</span></div>
      <div class="list-row" id="opt-reset"><span class="name" style="color:#c25a4a;">🗑 Reset Progress</span></div>
    `, () => {
      document.getElementById('opt-undo').addEventListener('click', () => { undo(); closeModal(); });
      document.getElementById('opt-redo').addEventListener('click', () => { redo(); closeModal(); });
      document.getElementById('opt-reset').addEventListener('click', () => { resetProgress(); closeModal(); });
      document.getElementById('opt-close').addEventListener('click', closeModal);
    });
  });

  paintAll();
}

async function renderTutorialDetail(id) {
  const t = getTutorial(id);
  if (!t) { mainEl.innerHTML = `<div class="empty-state">Tutorial not found.</div>`; return; }
  let practiceMode = false;
  let completedSteps = new Set();

  function stepsHtml() {
    return t.steps.map(s => `
      <div class="card step-card" data-step="${s.id}">
        ${practiceMode
          ? `<button class="row-check ${completedSteps.has(s.id) ? 'done' : ''}" data-toggle-step="${s.id}">${completedSteps.has(s.id) ? '✓' : ''}</button>`
          : `<div class="step-num">${s.id}</div>`}
        <div><div class="step-title">${esc(s.title)}</div><div class="step-instruction">${esc(s.instruction)}</div></div>
      </div>
    `).join('');
  }

  mainEl.innerHTML = `
    <div class="card section-card">${esc(t.explanation)}</div>
    <div class="card section-card toggle-row">
      <span style="font-weight:600;font-size:0.9rem;">🧘 Practice Mode</span>
      <label class="switch"><input type="checkbox" id="practice-toggle"/><span class="track"></span></label>
    </div>
    <div class="section-title"><h2>Steps</h2></div>
    <div id="steps-container">${stepsHtml()}</div>
    ${t.tips.length ? `<div class="card tip-block"><h4>💡 Tips</h4><ul style="padding-left:18px;margin:0;">${t.tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${t.commonMistakes.length ? `<div class="card mistake-block"><h4>⚠ Common Mistakes</h4><ul style="padding-left:18px;margin:0;">${t.commonMistakes.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
  `;

  document.getElementById('practice-toggle').addEventListener('change', e => {
    practiceMode = e.target.checked;
    document.getElementById('steps-container').innerHTML = stepsHtml();
    wireSteps();
  });
  function wireSteps() {
    document.querySelectorAll('[data-toggle-step]').forEach(b => b.addEventListener('click', () => {
      const sid = Number(b.dataset.toggleStep);
      if (completedSteps.has(sid)) completedSteps.delete(sid); else completedSteps.add(sid);
      document.getElementById('steps-container').innerHTML = stepsHtml();
      wireSteps();
    }));
  }
}

async function renderProjects() {
  const projects = await db.getAll('projects');
  projects.sort((a, b) => b.createdAt - a.createdAt);
  const groups = { 'In Progress': [], Planned: [], Completed: [], Frogged: [] };
  for (const p of projects) (groups[p.status] || groups.Planned).push(p);

  if (!projects.length) {
    mainEl.innerHTML = `<div class="empty-state"><span class="glyph">☑</span>No projects yet. Tap + to start tracking one.</div>`;
  } else {
    let html = '';
    for (const [label, items] of Object.entries(groups)) {
      if (!items.length) continue;
      html += `<div class="section-title"><h2>${label}</h2></div><div class="card">`;
      html += items.map(p => {
        const pct = p.totalRows ? Math.min(100, Math.round((p.currentRowIndex / p.totalRows) * 100)) : (p.status === 'Completed' ? 100 : 0);
        return `
          <div class="list-row" data-id="${p.id}">
            <div><div class="name">${esc(p.name)}</div>${p.patternTitle ? `<div class="sub">${esc(p.patternTitle)}</div>` : ''}</div>
            <div style="font-family:var(--font-mono);font-size:0.75rem;color:var(--terracotta);">${p.status === 'In Progress' ? pct + '%' : (p.status === 'Completed' ? '✓' : '')}</div>
          </div>
        `;
      }).join('');
      html += `</div>`;
    }
    mainEl.innerHTML = html;
    mainEl.querySelectorAll('[data-id]').forEach(el => el.addEventListener('click', () => navigate(`project/${el.dataset.id}`)));
  }
  mainEl.innerHTML += `<button class="fab" id="add-project-fab">+</button>`;
  document.getElementById('add-project-fab').addEventListener('click', () => navigate('project-new'));
}

      notes: document.getElementById('f-notes').value,
      photos,
      createdAt: existing?.createdAt || Date.now()
    };
    await db.put('projects', record);
    toast(existing ? 'Project updated' : 'Project created');
    navigate('projects');
  });

  const delBtn = document.getElementById('f-delete');
  if (delBtn) delBtn.addEventListener('click', async () => {
    if (confirm('Delete this project? This cannot be undone.')) {
      await db.delete('projects', existing.id);
      toast('Project deleted');
      navigate('projects');
    }
  });
}

// ===================== Stash (Yarn + Hooks) =====================

async function renderStash(tab) {
  mainEl.innerHTML = `
    <div class="filter-row">
      <button class="chip ${tab === 'yarn' ? 'active' : ''}" id="tab-yarn">🧶 Yarn</button>
      <button class="chip ${tab === 'hooks' ? 'active' : ''}" id="tab-hooks">⚓ Hooks</button>
    </div>
    <div id="stash-body"></div>
  `;
  document.getElementById('tab-yarn').addEventListener('click', () => navigate('stash/yarn'));
  document.getElementById('tab-hooks').addEventListener('click', () => navigate('stash/hooks'));

  const body = document.getElementById('stash-body');
  if (tab === 'hooks') {
    const hooks = await db.getAll('hooks');
    hooks.sort((a, b) => a.sizeMM - b.sizeMM);
    body.innerHTML = hooks.length ? `<div class="card">${hooks.map(h => `
      <div class="list-row" data-id="${h.id}">
        <div><div class="name">${esc(h.sizeUS)} — ${h.sizeMM}mm</div><div class="sub">${esc(h.brand)} • ${esc(h.material)}</div></div>
        ${h.favorite ? '<span>⭐</span>' : ''}
      </div>`).join('')}</div>` : `<div class="empty-state"><span class="glyph">⚓</span>No hooks saved. Tap + to add one.</div>`;
    body.querySelectorAll('[data-id]').forEach(el => el.addEventListener('click', () => navigate(`hookitem/${el.dataset.id}`)));
    mainEl.innerHTML += `<button class="fab" id="stash-fab">+</button>`;
    document.getElementById('stash-fab').addEventListener('click', () => navigate('hook-new'));
  } else {
    const yarns = await db.getAll('yarn');
    yarns.sort((a, b) => a.brand.localeCompare(b.brand));
    const low = yarns.filter(y => y.quantity <= y.lowStockThreshold);
    let html = '';
    if (low.length) {
      html += `<div class="card section-card" style="margin-bottom:14px;"><h3 style="color:#c98a3e;">⚠ Low Stock</h3>${low.map(y => `<div class="note-line">${esc(y.brand)} – ${esc(y.color)} is running low (${y.quantity} left)</div>`).join('')}</div>`;
    }
    html += yarns.length ? `<div class="card">${yarns.map(y => `
      <div class="list-row" data-id="${y.id}">
        <div><div class="name">${esc(y.brand)} – ${esc(y.color)}</div><div class="sub">${esc(y.weight)} • ${esc(y.fiber)}</div></div>
        <span style="font-family:var(--font-mono);font-weight:700;color:${y.quantity <= y.lowStockThreshold ? '#c98a3e' : 'var(--cocoa-soft)'}">×${y.quantity}</span>
      </div>`).join('')}</div>` : `<div class="empty-state"><span class="glyph">🧶</span>No yarn saved. Tap + to add some.</div>`;
    body.innerHTML = html;
    body.querySelectorAll('[data-id]').forEach(el => el.addEventListener('click', () => navigate(`yarn/${el.dataset.id}`)));
    mainEl.innerHTML += `<button class="fab" id="stash-fab">+</button>`;
    document.getElementById('stash-fab').addEventListener('click', () => navigate('yarn-new'));
  }
}

async function renderYarnForm(id) {
  const existing = id ? await db.get('yarn', id) : null;
  const weights = ['Lace (0)', 'Fingering (1)', 'Sport (2)', 'DK (3)', 'Worsted (4)', 'Bulky (5)', 'Super Bulky (6)'];
  mainEl.innerHTML = `
    <div class="field"><label>Brand</label><input id="y-brand" value="${esc(existing?.brand || '')}" /></div>
    <div class="field"><label>Color</label><input id="y-color" value="${esc(existing?.color || '')}" /></div>
    <div class="field"><label>Weight</label><select id="y-weight">${weights.map(w => `<option ${existing?.weight === w ? 'selected' : ''}>${w}</option>`).join('')}</select></div>
    <div class="field"><label>Fiber content</label><input id="y-fiber" value="${esc(existing?.fiber || '')}" placeholder="e.g. 100% Acrylic" /></div>
    <div class="field"><label>Quantity (skeins)</label><input id="y-qty" type="number" min="0" value="${existing?.quantity ?? 1}" /></div>
    <div class="field"><label>Low stock alert below</label><input id="y-low" type="number" min="0" value="${existing?.lowStockThreshold ?? 1}" /></div>
    <div class="field"><label>Purchase date</label><input id="y-date" type="date" value="${existing?.purchaseDate || ''}" /></div>
    <div class="field"><label>Price</label><input id="y-price" type="number" step="0.01" value="${existing?.price ?? ''}" /></div>
    <div class="field"><label>Photo</label><input type="file" id="y-photo" accept="image/*" />
      <div id="y-photo-preview" style="margin-top:8px;">${existing?.photo ? `<img src="${existing.photo}" style="width:80px;height:80px;object-fit:cover;border-radius:10px;"/>` : ''}</div>
    </div>
    <div class="field"><label>Notes</label><textarea id="y-notes">${esc(existing?.notes || '')}</textarea></div>
    <button class="btn-primary" id="y-save">${existing ? 'Save Changes' : 'Add Yarn'}</button>
    ${existing ? `<button class="btn-secondary" id="y-delete" style="width:100%;margin-top:10px;color:#c25a4a;">Delete</button>` : ''}
  `;
  let photo = existing?.photo || null;
  document.getElementById('y-photo').addEventListener('change', async e => {
    if (e.target.files[0]) { photo = await fileToDataUrl(e.target.files[0]); document.getElementById('y-photo-preview').innerHTML = `<img src="${photo}" style="width:80px;height:80px;object-fit:cover;border-radius:10px;"/>`; }
  });
  document.getElementById('y-save').addEventListener('click', async () => {
    const brand = document.getElementById('y-brand').value.trim();
    if (!brand) { toast('Add a brand name'); return; }
    const record = {
      id: existing?.id || uid(),
      brand,
      color: document.getElementById('y-color').value,
      weight: document.getElementById('y-weight').value,
      fiber: document.getElementById('y-fiber').value,
      quantity: Number(document.getElementById('y-qty').value) || 0,
      lowStockThreshold: Number(document.getElementById('y-low').value) || 0,
      purchaseDate: document.getElementById('y-date').value,
      price: document.getElementById('y-price').value ? Number(document.getElementById('y-price').value) : null,
      photo,
      notes: document.getElementById('y-notes').value
    };
    await db.put('yarn', record);
    toast(existing ? 'Yarn updated' : 'Yarn added');
    navigate('stash/yarn');
  });
  const delBtn = document.getElementById('y-delete');
  if (delBtn) delBtn.addEventListener('click', async () => {
    if (confirm('Delete this yarn entry?')) { await db.delete('yarn', existing.id); navigate('stash/yarn'); }
  });
}

async function renderHookForm(id) {
  const existing = id ? await db.get('hooks', id) : null;
  mainEl.innerHTML = `
    <div class="field"><label>US size (e.g. H/8)</label><input id="h-us" value="${esc(existing?.sizeUS || '')}" /></div>
    <div class="field"><label>mm size</label><input id="h-mm" type="number" step="0.25" value="${existing?.sizeMM ?? 4}" /></div>
    <div class="field"><label>Brand</label><input id="h-brand" value="${esc(existing?.brand || '')}" /></div>
    <div class="field"><label>Material</label><input id="h-material" value="${esc(existing?.material || '')}" placeholder="e.g. Aluminum, Ergonomic" /></div>
    <div class="toggle-row"><span>Favorite</span><label class="switch"><input type="checkbox" id="h-fav" ${existing?.favorite ? 'checked' : ''}/><span class="track"></span></label></div>
    <div class="field"><label>Notes</label><textarea id="h-notes">${esc(existing?.notes || '')}</textarea></div>
    <button class="btn-primary" id="h-save">${existing ? 'Save Changes' : 'Add Hook'}</button>
    ${existing ? `<button class="btn-secondary" id="h-delete" style="width:100%;margin-top:10px;color:#c25a4a;">Delete</button>` : ''}
  `;
  document.getElementById('h-save').addEventListener('click', async () => {
    const sizeUS = document.getElementById('h-us').value.trim();
    if (!sizeUS) { toast('Add a US size'); return; }
    const record = {
      id: existing?.id || uid(),
      sizeUS,
      sizeMM: Number(document.getElementById('h-mm').value) || 0,
      brand: document.getElementById('h-brand').value,
      material: document.getElementById('h-material').value,
      favorite: document.getElementById('h-fav').checked,
      notes: document.getElementById('h-notes').value
    };
    await db.put('hooks', record);
    toast(existing ? 'Hook updated' : 'Hook added');
    navigate('stash/hooks');
  });
  const delBtn = document.getElementById('h-delete');
  if (delBtn) delBtn.addEventListener('click', async () => {
    if (confirm('Delete this hook?')) { await db.delete('hooks', existing.id); navigate('stash/hooks'); }
  });
}

// ===================== Favorites =====================

async function renderFavorites() {
  const favs = await db.getAll('favorites');
  favs.sort((a, b) => b.dateAdded - a.dateAdded);
  const favPatterns = favs.map(f => getPattern(f.patternId)).filter(Boolean);

  const recents = await db.getAll('recents');
  recents.sort((a, b) => b.viewedAt - a.viewedAt);
  const recentPatterns = recents.slice(0, 20).map(r => getPattern(r.patternId)).filter(Boolean);

  mainEl.innerHTML = `
    <div class="section-title"><h2>Favorites (${favPatterns.length})</h2></div>
    ${favPatterns.length ? `<div class="card">${favPatterns.map(compactRowHtml).join('')}</div>` : `<div class="empty-state">No favorites yet. Tap the heart on any pattern to save it here.</div>`}
    ${recentPatterns.length ? `<div class="section-title"><h2>Recently Viewed</h2></div><div class="card">${recentPatterns.map(compactRowHtml).join('')}</div>` : ''}
  `;
  mainEl.querySelectorAll('[data-id]').forEach(el => el.addEventListener('click', () => navigate(`pattern/${el.dataset.id}`)));
}

function compactRowHtml(p) {
  return `
    <div class="list-row" data-id="${p.id}">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:40px;height:40px;border-radius:9px;background:${colorFor(p.category)}22;display:flex;align-items:center;justify-content:center;">${iconFor(p.category)}</div>
        <div><div class="name">${esc(p.title)}</div><div class="sub">${esc(p.category)}</div></div>
      </div>
      <span class="badge ${badgeClass(p.difficulty)}">${p.difficulty}</span>
    </div>
  `;
}

// ===================== Nav wiring & boot =====================

navEl.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => navigate(btn.dataset.route));
});

if (!location.hash) location.hash = '#/library';
render();



</script>
